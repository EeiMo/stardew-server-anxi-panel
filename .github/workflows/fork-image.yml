name: fork-image

# Publishes this fork's own panel image to GHCR so the server can run the fork
# build instead of the upstream release image.
#
# The upstream pipeline (.github/workflows/release.yml) pushes to the upstream
# registry namespaces and depends on upstream secrets and release gates, so it
# cannot be reused from a fork. This workflow only builds the image and pushes it
# to this account's own GHCR namespace.
#
# Note on registry choice: the deployment host cannot reach
# registry-1.docker.io or proxy.golang.org directly, so it cannot build the image
# itself. GitHub runners have unrestricted network access and ghcr.io is
# reachable from the host, which makes this the only practical publish path.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR repository paths must be lowercase, but the account name is not.
      - name: Resolve image reference
        id: image
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/stardew-server-anxi-panel" >>"$GITHUB_OUTPUT"

      - name: Compute build metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=0.7.2-ei.${{ github.run_number }}" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:latest
            ${{ steps.image.outputs.ref }}:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Fork image published"
            echo
            echo "- \`${{ steps.image.outputs.ref }}:${{ steps.meta.outputs.version }}\`"
            echo "- \`${{ steps.image.outputs.ref }}:latest\`"
            echo "- version \`${{ steps.meta.outputs.version }}\`"
            echo "- commit \`${{ steps.meta.outputs.commit }}\`"
            echo
            echo "If this is the first publish the package is private by default."
            echo "Set it to public (Package settings -> Change visibility) so the host"
            echo "can pull it anonymously, or log in with a token that has read:packages."
          } >>"$GITHUB_STEP_SUMMARY"
