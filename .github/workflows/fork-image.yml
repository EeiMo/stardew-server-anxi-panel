name: fork-image

# Publishes this fork's own panel image so the deployment host can run the fork
# build instead of the upstream release image.
#
# Two registries are targeted on purpose:
#   * Docker Hub  — the deployment host reaches it through the docker.1ms.run
#                   mirror at full speed (measured: alpine in 1s), which is the
#                   only fast image channel available there.
#   * GHCR        — kept for anyone whose network can actually reach the GHCR
#                   blob CDN. The host in question cannot: ghcr.io serves the
#                   manifest normally but redirects layers to
#                   pkg-containers.githubusercontent.com, measured at 19 KB/s,
#                   and every GHCR mirror tried either 404s or stalls the same
#                   way.
#
# The upstream pipeline (.github/workflows/release.yml) pushes to the upstream
# registry namespaces and depends on upstream secrets and release gates, so it
# cannot be reused from a fork.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Full history and tags: a branch build derives its version from the highest
      # existing tag, which a shallow checkout would not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Registry repository paths must be lowercase, but the account name is not.
      - name: Resolve image references
        id: image
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ghcr=ghcr.io/${owner}/stardew-server-anxi-panel" >>"$GITHUB_OUTPUT"
          if [ -n "${DOCKERHUB_USER}" ]; then
            echo "dockerhub=docker.io/${DOCKERHUB_USER}/stardew-server-anxi-panel" >>"$GITHUB_OUTPUT"
          else
            echo "dockerhub=" >>"$GITHUB_OUTPUT"
          fi

      # Every image must carry a stable MAJOR.MINOR.PATCH version, including branch
      # builds.
      #
      # The panel's one-click updater accepts an exact stable semantic version only:
      # internal/updater.NormalizeTargetVersion rejects anything with a prerelease
      # suffix, while the update check's parseSemver accepts one. A build versioned
      # 0.7.2-ei.11 therefore gets an "upgrade available" offer from the check and is
      # refused by the apply every single time - the button can never work. Do not
      # reintroduce a prerelease version scheme here.
      #
      #   tag push    -> that exact version, e.g. v0.8.1 -> 0.8.1
      #   branch push -> the highest existing tag, so a branch build equals the
      #                  release it is based on and no upgrade is offered until a
      #                  newer tag exists.
      - name: Compute build metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          fi
          version="${version#v}"
          version="${version#V}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::no stable semantic version to build with (got '${version:-<none>}'); create an annotated vMAJOR.MINOR.PATCH tag first, because the panel updater rejects prerelease versions outright"
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.image.outputs.dockerhub != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ghcr }}:latest
            ${{ steps.image.outputs.ghcr }}:${{ steps.meta.outputs.version }}
            ${{ steps.image.outputs.dockerhub }}:latest
            ${{ steps.image.outputs.dockerhub }}:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          DOCKERHUB_IMAGE: ${{ steps.image.outputs.dockerhub }}
        run: |
          {
            echo "### Fork image published"
            echo
            echo "- version \`${{ steps.meta.outputs.version }}\`"
            echo "- commit \`${{ steps.meta.outputs.commit }}\`"
            echo
            echo "GHCR: \`${{ steps.image.outputs.ghcr }}:${{ steps.meta.outputs.version }}\`"
            if [ -n "${DOCKERHUB_IMAGE}" ]; then
              echo
              echo "Docker Hub: \`${DOCKERHUB_IMAGE}:${{ steps.meta.outputs.version }}\`"
              echo
              echo "The deployment host pulls Docker Hub through the docker.1ms.run"
              echo "mirror, so use \`docker.1ms.run/<user>/stardew-server-anxi-panel:latest\`."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
