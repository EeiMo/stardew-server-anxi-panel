name: Deploy docs portal

on:
  # Push triggering was removed in this fork: the deploy job targets GitHub Pages
  # with the "github-pages" environment, which is not configured here, so any push
  # touching website/** failed. Enable Pages in the repository settings and restore
  # the push trigger below if this fork should serve its own documentation portal.
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - 'website/**'
  #     - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: cd website && npm ci
      - name: Build with VitePress
        run: cd website && npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
